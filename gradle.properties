# JVM 参数
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/home/agent/tmp

# AndroidX
android.useAndroidX=true

# AGP 9 内置 Kotlin（built-in Kotlin）：不再应用 org.jetbrains.kotlin.android
android.builtInKotlin=true

# 非传递 R 类（按资源包隔离 R 类，减小编译面）
android.nonTransitiveRClass=true

# Kotlin 官方代码风格
kotlin.code.style=official
org.gradle.java.home=/usr/lib64/jvm/java-17-openjdk-17
